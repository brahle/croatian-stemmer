name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv venv --python ${{ matrix.python }} && uv pip install -e ".[dev]"

      - name: Run tests (including C/Python parity)
        run: uv run --no-sync pytest tests/ --ignore=tests/web -v

      - name: C rule header is up to date
        run: |
          uv run --no-sync python gen_rules_c.py
          git diff --exit-code pg/croatian_stemmer_rules.h

  pg-extension:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        pg: [15, 16, 17, 18]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Standalone C tests
        run: |
          cd pg/
          cc -o test_stemmer test_stemmer.c croatian_stemmer.c -I. -Wall -Werror
          ./test_stemmer

      - name: Build and run regression tests on PostgreSQL ${{ matrix.pg }}
        run: |
          cd pg/
          ./docker-test.sh ${{ matrix.pg }}

  labeling-web:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_USER: labeling
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: labeling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LABELING_TEST_DATABASE_URL: postgresql+asyncpg://labeling:synthetic-test-only@127.0.0.1:5432/labeling_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Locked dependencies and browser
        run: |
          uv python install 3.14
          uv sync --frozen --extra web --extra dev
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: PostgreSQL, JWT, migrations and browser acceptance
        run: ./scripts/test-web.sh
      - name: Build labeling container
        run: docker build -f Dockerfile.web -t labeling-ci .
